<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - MyDevice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen text-slate-800">
    
    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-2xl max-w-sm w-full mx-4 slide-up">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-house-chimney text-2xl text-blue-600"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Smart Home Login</h2>
                <p class="text-sm text-slate-500 mt-1">Application Authentication</p>
            </div>
            
            <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-3 top-3 text-slate-400"></i>
                        <input type="email" id="email" required class="w-full border border-slate-200 rounded-xl py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="you@example.com">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400"></i>
                        <input type="password" id="password" required class="w-full border border-slate-200 rounded-xl py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="••••••••">
                    </div>
                </div>
                <div id="login-error" class="hidden text-sm text-red-500 font-medium text-center">Invalid credentials</div>
                <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg active:scale-[0.98]">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-100 p-2 rounded-lg"><i class="fa-solid fa-house text-xl text-blue-700"></i></div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-800">Smart Home Dashboard</h1>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="connection-status" class="text-xs font-bold px-3 py-1 rounded bg-slate-200 text-slate-600">Connecting...</div>
                    <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-power-off text-lg"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6 slide-up">
            
            <!-- Sensor Row -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-500 flex items-center justify-center mb-1"><i class="fa-solid fa-temperature-half"></i></div>
                    <p class="text-2xl font-bold text-slate-800"><span id="val-temp">--</span>°C</p>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wide">Temperature</p>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center mb-1"><i class="fa-solid fa-droplet"></i></div>
                    <p class="text-2xl font-bold text-slate-800"><span id="val-hum">--</span>%</p>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wide">Humidity</p>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-teal-100 text-teal-500 flex items-center justify-center mb-1"><i class="fa-solid fa-wind"></i></div>
                    <p class="text-2xl font-bold text-slate-800"><span id="val-aqi">--</span></p>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wide">AQI</p>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-500 flex items-center justify-center mb-1"><i class="fa-solid fa-sun"></i></div>
                    <p class="text-2xl font-bold text-slate-800"><span id="val-light">--</span></p>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wide">Lux</p>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-2 col-span-2 md:col-span-1">
                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-500 flex items-center justify-center mb-1"><i class="fa-solid fa-bolt"></i></div>
                    <p class="text-2xl font-bold text-slate-800"><span id="val-power">--</span> W</p>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wide">Power</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Lighting & Security -->
                <div class="glass-panel rounded-2xl overflow-hidden">
                    <div class="bg-gradient-to-r from-indigo-500 to-purple-500 px-6 py-4"><h2 class="font-bold text-lg text-white"><i class="fa-solid fa-lightbulb mr-2"></i> Lighting & Security</h2></div>
                    <div class="p-6 space-y-4">
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="font-semibold">Main Light</span>
                            <input type="checkbox" id="toggle-mlight" class="w-12 h-6 accent-purple-500 cursor-pointer" onchange="cmd('main_light', this.checked)">
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="font-semibold">Bedroom Light</span>
                            <input type="checkbox" id="toggle-blight" class="w-12 h-6 accent-purple-500 cursor-pointer" onchange="cmd('bedroom_light', this.checked)">
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="font-semibold">Door Lock</span>
                            <button id="btn-door" onclick="cmd('door_lock', !document.getElementById('btn-door').dataset.locked)" data-locked="true" class="px-5 py-2 bg-red-500 text-white font-bold rounded-lg transition-colors">LOCKED</button>
                        </div>
                    </div>
                </div>

                <!-- Climate -->
                <div class="glass-panel rounded-2xl overflow-hidden">
                    <div class="bg-gradient-to-r from-blue-500 to-cyan-500 px-6 py-4"><h2 class="font-bold text-lg text-white"><i class="fa-solid fa-snowflake mr-2"></i> Climate Control</h2></div>
                    <div class="p-6 space-y-6">
                        <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                            <div class="flex justify-between items-center mb-4">
                                <span class="font-semibold">Air Conditioner</span>
                                <input type="checkbox" id="toggle-ac" class="w-12 h-6 accent-blue-500 cursor-pointer" onchange="cmd('ac', this.checked)">
                            </div>
                            <label class="text-sm text-slate-500 block mb-2">Target Temp: <span id="lbl-ac-temp" class="font-bold text-blue-600">22</span>°C</label>
                            <input type="range" id="slider-ac" min="16" max="30" step="0.5" class="w-full accent-blue-500" onchange="cmd('ac_temp', this.value)">
                        </div>
                        <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                            <div class="flex justify-between items-center mb-4">
                                <span class="font-semibold">Ceiling Fan</span>
                                <input type="checkbox" id="toggle-fan" class="w-12 h-6 accent-blue-500 cursor-pointer" onchange="cmd('fan', this.checked)">
                            </div>
                            <label class="text-sm text-slate-500 block mb-2">Fan Speed: <span id="lbl-fan-speed" class="font-bold text-blue-600">3</span></label>
                            <input type="range" id="slider-fan" min="1" max="5" step="1" class="w-full accent-blue-500" onchange="cmd('fan_speed', this.value)">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="glass-panel p-4 rounded-xl mt-4">
                <h3 class="font-bold mb-2">Event Log</h3>
                <div id="event-log" class="h-32 overflow-y-auto font-mono text-xs space-y-1 text-slate-600 bg-slate-50 p-2 rounded"></div>
            </div>
        </main>
    </div>

    <script>
        const PLATFORM_BASE_URL = window.PLATFORM_BASE_URL || 'http://localhost:3000';
        const PLATFORM_APP_ID = window.PLATFORM_APP_ID || 'REPLACE_WITH_APP_ID';

        const ROUTES = {
            env_telemetry: '/api/v1/routes/home_env_tel_route_id',
            ctrl_telemetry: '/api/v1/routes/home_ctrl_tel_route_id',
            ctrl_commands: '/api/v1/routes/home_ctrl_cmd_route_id'
        };

        let authToken = localStorage.getItem('homeAuthToken');
        let streams = [];

        window.onload = () => { if (authToken) showDashboard(); };

        function addLog(msg) {
            const log = document.getElementById('event-log');
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(div); log.scrollTop = log.scrollHeight;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            btn.textContent = 'Authenticating...'; btn.disabled = true; err.classList.add('hidden');

            try {
                const res = await fetch(`${PLATFORM_BASE_URL}/api/applications/${PLATFORM_APP_ID}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    authToken = data.token; localStorage.setItem('homeAuthToken', authToken); showDashboard();
                } else throw new Error(data.message || 'Login failed');
            } catch (error) {
                err.innerText = error.message; err.classList.remove('hidden');
            } finally {
                btn.textContent = 'Sign In'; btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('homeAuthToken'); authToken = null;
            streams.forEach(s => s.abort()); streams = [];
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function showDashboard() {
            if (PLATFORM_APP_ID.includes('REPLACE_WITH')) {
                alert("Please replace PLATFORM_APP_ID and ROUTES with actual Application API values."); logout(); return;
            }
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            connectSSE(ROUTES.env_telemetry, processEnv);
            connectSSE(ROUTES.ctrl_telemetry, processCtrl);
        }

        async function connectSSE(route, callback) {
            const controller = new AbortController();
            streams.push(controller);
            document.getElementById('connection-status').innerText = 'Connected via SSE';
            document.getElementById('connection-status').className = 'text-xs font-bold px-3 py-1 rounded bg-green-100 text-green-700';

            try {
                const res = await fetch(`${PLATFORM_BASE_URL}${route}`, {
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Accept': 'text/event-stream' },
                    signal: controller.signal
                });
                if (!res.ok) throw new Error("SSE connection failed");

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const chunks = buffer.split('\n\n');
                    buffer = chunks.pop();

                    for (const chunk of chunks) {
                        let eventType = 'message', dataStr = null;
                        for (const line of chunk.split('\n')) {
                            if (line.startsWith('event: ')) eventType = line.slice(7).trim();
                            else if (line.startsWith('data: ')) dataStr = line.slice(6).trim();
                        }
                        if (eventType === 'device_data' && dataStr) {
                            try { callback(JSON.parse(dataStr).payload); } catch(e){}
                        }
                    }
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    addLog("SSE Disconnected, reconnecting...");
                    setTimeout(() => connectSSE(route, callback), 3000);
                }
            }
        }

        function processEnv(data) {
            if(!data) return;
            if(data.temperature !== undefined) document.getElementById('val-temp').innerText = data.temperature;
            if(data.humidity !== undefined) document.getElementById('val-hum').innerText = data.humidity;
            if(data.air_quality !== undefined) document.getElementById('val-aqi').innerText = data.air_quality;
            if(data.light_level !== undefined) document.getElementById('val-light').innerText = data.light_level;
            if(data.power_consumption !== undefined) document.getElementById('val-power').innerText = data.power_consumption;
        }

        function processCtrl(data) {
            if(!data) return;
            if(data.main_light !== undefined && document.activeElement !== document.getElementById('toggle-mlight')) document.getElementById('toggle-mlight').checked = data.main_light;
            if(data.bedroom_light !== undefined && document.activeElement !== document.getElementById('toggle-blight')) document.getElementById('toggle-blight').checked = data.bedroom_light;
            if(data.ac !== undefined && document.activeElement !== document.getElementById('toggle-ac')) document.getElementById('toggle-ac').checked = data.ac;
            if(data.fan !== undefined && document.activeElement !== document.getElementById('toggle-fan')) document.getElementById('toggle-fan').checked = data.fan;
            if(data.ac_temp !== undefined && document.activeElement !== document.getElementById('slider-ac')) { document.getElementById('slider-ac').value = data.ac_temp; document.getElementById('lbl-ac-temp').innerText = data.ac_temp; }
            if(data.fan_speed !== undefined && document.activeElement !== document.getElementById('slider-fan')) { document.getElementById('slider-fan').value = data.fan_speed; document.getElementById('lbl-fan-speed').innerText = data.fan_speed; }
            
            if(data.door_lock !== undefined) {
                const doorBtn = document.getElementById('btn-door');
                doorBtn.dataset.locked = data.door_lock;
                if(data.door_lock) { doorBtn.innerText = 'LOCKED'; doorBtn.className = 'px-5 py-2 bg-green-500 text-white font-bold rounded-lg transition-colors'; }
                else { doorBtn.innerText = 'UNLOCKED'; doorBtn.className = 'px-5 py-2 bg-red-500 text-white font-bold rounded-lg transition-colors'; }
            }
        }

        async function cmd(type, val) {
            let actualVal = typeof val === 'string' ? parseFloat(val) : val;
            addLog(`Command: ${type} -> ${actualVal}`);
            try {
                await fetch(`${PLATFORM_BASE_URL}${ROUTES.ctrl_commands}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ type: `SET_${type.toUpperCase()}`, payload: { [type]: actualVal } })
                });
            } catch(e) { addLog("Cmd Failed: " + e.message); }
        }
    </script>
</body>
</html>
