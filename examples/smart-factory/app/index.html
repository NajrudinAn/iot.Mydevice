<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Factory - MyDevice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(75, 85, 99, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-950 min-h-screen text-gray-100 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-gray-950 to-black">
    
    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 transition-opacity">
        <div class="bg-gray-900 p-8 sm:p-10 rounded-2xl border border-gray-700 shadow-2xl max-w-sm w-full mx-4 slide-up">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-orange-900/50 border border-orange-500/30 rounded-xl flex items-center justify-center mx-auto mb-4 rotate-3">
                    <i class="fa-solid fa-industry text-2xl text-orange-500"></i>
                </div>
                <h2 class="text-2xl font-bold font-mono tracking-wide text-white uppercase">SCADA Terminal</h2>
                <p class="text-sm text-gray-400 mt-1 font-mono">MyDevice Auth Protocol</p>
            </div>
            
            <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-mono text-gray-400 uppercase tracking-widest mb-1">Operator Email</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-3 top-3 text-gray-500"></i>
                        <input type="email" id="email" required class="w-full bg-gray-950 border border-gray-700 rounded-xl py-2.5 pl-10 pr-3 focus:ring-1 focus:ring-orange-500 outline-none transition-all text-white font-mono placeholder-gray-600" placeholder="sysadmin@factory.local">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 uppercase tracking-widest mb-1">Clearance Code</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-500"></i>
                        <input type="password" id="password" required class="w-full bg-gray-950 border border-gray-700 rounded-xl py-2.5 pl-10 pr-3 focus:ring-1 focus:ring-orange-500 outline-none transition-all text-white font-mono placeholder-gray-600" placeholder="••••••••">
                    </div>
                </div>
                <div id="login-error" class="hidden text-sm text-red-500 font-mono text-center bg-red-950/30 py-2 rounded border border-red-900/50">ACCESS DENIED</div>
                <button type="submit" id="login-btn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold font-mono uppercase tracking-widest py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(234,88,12,0.3)] active:scale-[0.98]">
                    Initiate Link
                </button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <header class="glass-panel sticky top-0 z-40 border-b-0 border-t-0 border-x-0 border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap lg:flex-nowrap justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-orange-600 to-red-600 p-2 rounded text-white shadow-[0_0_10px_rgba(234,88,12,0.5)]"><i class="fa-solid fa-industry text-xl"></i></div>
                    <div><h1 class="text-xl font-bold font-mono tracking-widest uppercase">Factory SCADA</h1></div>
                </div>
                <!-- Global Environment Panel -->
                <div class="flex-1 max-w-2xl bg-gray-900/80 border border-gray-800 rounded-lg p-2 flex items-center justify-between gap-4">
                    <div class="flex gap-4 sm:gap-8 px-2">
                        <div><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest">Ambient</p><p class="font-mono font-bold text-gray-200"><span id="env-temp" class="text-lg">--</span>°C</p></div>
                        <div><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest">Humidity</p><p class="font-mono font-bold text-gray-200"><span id="env-hum" class="text-lg">--</span>%</p></div>
                    </div>
                    <div class="flex items-center gap-3 border-l border-gray-800 pl-4">
                        <button id="btn-fan" onclick="toggleEnv('cooling_fan')" class="font-mono text-xs font-bold px-3 py-1.5 rounded bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors border border-gray-700">FAN OFF</button>
                        <button id="btn-alarm" onclick="toggleEnv('alarm')" class="font-mono text-xs font-bold px-3 py-1.5 rounded bg-gray-800 text-gray-400 hover:bg-red-900/50 transition-colors border border-gray-700">ALARM OFF</button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="connection-status" class="text-xs font-mono bg-gray-800 text-gray-400 px-2 py-1 rounded">CONNECTING...</div>
                    <button onclick="logout()" class="text-gray-500 hover:text-red-500 transition-colors p-1" title="Disconnect"><i class="fa-solid fa-power-off text-lg"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 slide-up space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Machine 1 -->
                <div class="glass-panel rounded-xl overflow-hidden flex flex-col">
                    <div class="bg-gray-800/80 px-5 py-3 border-b border-gray-700 flex justify-between items-center">
                        <div class="flex items-center gap-3"><i class="fa-solid fa-microchip text-blue-500"></i><h2 class="text-lg font-bold font-mono tracking-widest text-white">CNC MILLING 01</h2></div>
                        <span id="m1-status" class="px-2 py-0.5 rounded text-[10px] font-bold font-mono tracking-widest bg-gray-700 text-gray-400">OFFLINE</span>
                    </div>
                    <div class="p-6 flex-1 space-y-8">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">State</p><p id="m1-state" class="font-mono font-bold text-gray-400">--</p></div>
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">RPM</p><p class="font-mono font-bold text-blue-400 text-xl"><span id="m1-rpm">0</span></p></div>
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Temp</p><p class="font-mono font-bold text-orange-500 text-xl"><span id="m1-temp">--</span>°</p></div>
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Vibration</p><p class="font-mono font-bold text-yellow-500 text-xl"><span id="m1-vib">--</span></p></div>
                        </div>
                        <div class="flex flex-wrap sm:flex-nowrap gap-3">
                            <button onclick="machineCmd('m1', 'start')" class="flex-1 bg-green-900/30 hover:bg-green-800 text-green-500 hover:text-white border border-green-700/50 py-3 rounded-lg font-mono font-bold tracking-widest transition-all">START</button>
                            <button onclick="machineCmd('m1', 'stop')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 py-3 rounded-lg font-mono font-bold tracking-widest transition-all">STOP</button>
                            <button onclick="machineCmd('m1', 'reset')" class="flex-1 bg-red-900/30 hover:bg-red-800 text-red-500 hover:text-white border border-red-800/50 py-3 rounded-lg font-mono font-bold tracking-widest transition-all">RESET</button>
                        </div>
                    </div>
                </div>

                <!-- Machine 2 -->
                <div class="glass-panel rounded-xl overflow-hidden flex flex-col">
                    <div class="bg-gray-800/80 px-5 py-3 border-b border-gray-700 flex justify-between items-center">
                        <div class="flex items-center gap-3"><i class="fa-solid fa-gear text-purple-500"></i><h2 class="text-lg font-bold font-mono tracking-widest text-white">LATHE 02</h2></div>
                        <span id="m2-status" class="px-2 py-0.5 rounded text-[10px] font-bold font-mono tracking-widest bg-gray-700 text-gray-400">OFFLINE</span>
                    </div>
                    <div class="p-6 flex-1 space-y-8">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">State</p><p id="m2-state" class="font-mono font-bold text-gray-400">--</p></div>
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">RPM</p><p class="font-mono font-bold text-purple-400 text-xl"><span id="m2-rpm">0</span></p></div>
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Temp</p><p class="font-mono font-bold text-orange-500 text-xl"><span id="m2-temp">--</span>°</p></div>
                            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Vibration</p><p class="font-mono font-bold text-yellow-500 text-xl"><span id="m2-vib">--</span></p></div>
                        </div>
                        <div class="flex flex-wrap sm:flex-nowrap gap-3">
                            <button onclick="machineCmd('m2', 'start')" class="flex-1 bg-green-900/30 hover:bg-green-800 text-green-500 hover:text-white border border-green-700/50 py-3 rounded-lg font-mono font-bold tracking-widest transition-all">START</button>
                            <button onclick="machineCmd('m2', 'stop')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 py-3 rounded-lg font-mono font-bold tracking-widest transition-all">STOP</button>
                            <button onclick="machineCmd('m2', 'reset')" class="flex-1 bg-red-900/30 hover:bg-red-800 text-red-500 hover:text-white border border-red-800/50 py-3 rounded-lg font-mono font-bold tracking-widest transition-all">RESET</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="glass-panel p-4 rounded-xl">
                <h3 class="font-bold mb-2 font-mono text-gray-400 text-xs tracking-widest">SYSTEM TERMINAL</h3>
                <div id="event-log" class="h-24 overflow-y-auto font-mono text-xs space-y-1 text-green-400 bg-gray-950 p-3 rounded border border-gray-800"></div>
            </div>
        </main>
    </div>

    <script>
        const PLATFORM_BASE_URL = window.PLATFORM_BASE_URL || 'http://localhost:3000';
        const PLATFORM_APP_ID = window.PLATFORM_APP_ID || 'REPLACE_WITH_APP_ID';

        const ROUTES = {
            env_telemetry: '/api/v1/routes/factory_env_tel_route_id',
            env_commands: '/api/v1/routes/factory_env_cmd_route_id',
            m1_telemetry: '/api/v1/routes/factory_m1_tel_route_id',
            m1_commands: '/api/v1/routes/factory_m1_cmd_route_id',
            m2_telemetry: '/api/v1/routes/factory_m2_tel_route_id',
            m2_commands: '/api/v1/routes/factory_m2_cmd_route_id'
        };

        let authToken = localStorage.getItem('factoryAuthToken');
        let ENV_STATE = { cooling_fan: false, alarm: false };
        let streams = [];

        window.onload = () => { if (authToken) showDashboard(); };

        function addLog(msg) {
            const log = document.getElementById('event-log');
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] > ${msg}`;
            log.appendChild(div); log.scrollTop = log.scrollHeight;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            btn.textContent = 'AUTHENTICATING...'; btn.disabled = true; err.classList.add('hidden');

            try {
                const res = await fetch(`${PLATFORM_BASE_URL}/api/applications/${PLATFORM_APP_ID}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    authToken = data.token; localStorage.setItem('factoryAuthToken', authToken); showDashboard();
                } else throw new Error(data.message || 'ACCESS DENIED');
            } catch (error) {
                err.innerText = error.message; err.classList.remove('hidden');
            } finally {
                btn.textContent = 'INITIATE LINK'; btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('factoryAuthToken'); authToken = null;
            streams.forEach(s => s.abort()); streams = [];
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function showDashboard() {
            if (PLATFORM_APP_ID.includes('REPLACE_WITH')) {
                alert("Please replace PLATFORM_APP_ID and ROUTES with actual Application API values."); logout(); return;
            }
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            connectSSE(ROUTES.env_telemetry, processEnv, 'env');
            connectSSE(ROUTES.m1_telemetry, (data) => processMachine('m1', data), 'm1');
            connectSSE(ROUTES.m2_telemetry, (data) => processMachine('m2', data), 'm2');
        }

        async function connectSSE(route, callback, prefix) {
            const controller = new AbortController();
            streams.push(controller);
            document.getElementById('connection-status').innerText = 'LINK ESTABLISHED';
            document.getElementById('connection-status').className = 'text-xs font-mono bg-green-900/50 text-green-400 px-2 py-1 rounded border border-green-800';

            try {
                const res = await fetch(`${PLATFORM_BASE_URL}${route}`, {
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Accept': 'text/event-stream' },
                    signal: controller.signal
                });
                if (!res.ok) throw new Error("SSE connection failed");

                // Mark machine as ONLINE upon successful connection
                if(prefix !== 'env') {
                    const st = document.getElementById(`${prefix}-status`);
                    st.innerText = 'ONLINE';
                    st.className = 'px-2 py-0.5 rounded text-[10px] font-bold font-mono tracking-widest bg-green-900/50 text-green-400 border border-green-800';
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const chunks = buffer.split('\n\n');
                    buffer = chunks.pop();

                    for (const chunk of chunks) {
                        let eventType = 'message', dataStr = null;
                        for (const line of chunk.split('\n')) {
                            if (line.startsWith('event: ')) eventType = line.slice(7).trim();
                            else if (line.startsWith('data: ')) dataStr = line.slice(6).trim();
                        }
                        if (eventType === 'device_data' && dataStr) {
                            try { callback(JSON.parse(dataStr).payload); } catch(e){}
                        }
                    }
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    addLog(`[${prefix}] Link dropped, reconnecting...`);
                    
                    if(prefix !== 'env') {
                        const st = document.getElementById(`${prefix}-status`);
                        st.innerText = 'OFFLINE';
                        st.className = 'px-2 py-0.5 rounded text-[10px] font-bold font-mono tracking-widest bg-gray-800 text-gray-500 border border-gray-700';
                    }

                    setTimeout(() => connectSSE(route, callback, prefix), 3000);
                }
            }
        }

        function processEnv(data) {
            if(!data) return;
            if(data.temperature !== undefined) document.getElementById('env-temp').innerText = data.temperature;
            if(data.humidity !== undefined) document.getElementById('env-hum').innerText = data.humidity;
            
            if(data.cooling_fan !== undefined) ENV_STATE.cooling_fan = data.cooling_fan;
            if(data.alarm !== undefined) ENV_STATE.alarm = data.alarm;

            const bFan = document.getElementById('btn-fan');
            bFan.innerText = ENV_STATE.cooling_fan ? 'FAN ON' : 'FAN OFF';
            bFan.className = ENV_STATE.cooling_fan ? 'font-mono text-xs font-bold px-3 py-1.5 rounded bg-blue-600 text-white border border-blue-400 shadow-[0_0_10px_rgba(37,99,235,0.6)]' : 'font-mono text-xs font-bold px-3 py-1.5 rounded bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors border border-gray-700';

            const bAlm = document.getElementById('btn-alarm');
            bAlm.innerText = ENV_STATE.alarm ? 'ALARM ACTIVE' : 'ALARM OFF';
            bAlm.className = ENV_STATE.alarm ? 'font-mono text-xs font-bold px-3 py-1.5 rounded bg-red-600 text-white border border-red-400 shadow-[0_0_15px_rgba(220,38,38,0.8)] animate-pulse' : 'font-mono text-xs font-bold px-3 py-1.5 rounded bg-gray-800 text-gray-400 hover:bg-red-900/50 transition-colors border border-gray-700';
        }

        function processMachine(prefix, data) {
            if(!data) return;
            const stateEl = document.getElementById(`${prefix}-state`);
            if(data.operating_state) {
                stateEl.innerText = data.operating_state;
                if(data.operating_state === 'RUNNING') stateEl.className = 'font-mono font-bold text-green-400';
                else if(data.operating_state === 'WARNING') stateEl.className = 'font-mono font-bold text-red-500 animate-pulse drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]';
                else stateEl.className = 'font-mono font-bold text-gray-400';
            }
            if(data.rpm !== undefined) document.getElementById(`${prefix}-rpm`).innerText = data.rpm;
            if(data.temperature !== undefined) document.getElementById(`${prefix}-temp`).innerText = data.temperature;
            if(data.vibration !== undefined) document.getElementById(`${prefix}-vib`).innerText = data.vibration;
        }

        async function machineCmd(machine, cmd) {
            let route = machine === 'm1' ? ROUTES.m1_commands : ROUTES.m2_commands;
            addLog(`SYS CMD: ${machine} -> ${cmd}`);
            try {
                await fetch(`${PLATFORM_BASE_URL}${route}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: cmd }) // Platform expects { type, payload }
                });
            } catch(e) { addLog("ERR: " + e.message); }
        }

        async function toggleEnv(prop) {
            let newVal = !ENV_STATE[prop];
            addLog(`SYS CMD: env -> ${prop}=${newVal}`);
            try {
                await fetch(`${PLATFORM_BASE_URL}${ROUTES.env_commands}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: `SET_${prop.toUpperCase()}`,
                        payload: { [prop]: newVal }
                    })
                });
            } catch(e) { addLog("ERR: " + e.message); }
        }
    </script>
</body>
</html>
