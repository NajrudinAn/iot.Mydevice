<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Factory - MyDevice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; -webkit-tap-highlight-color: transparent; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(75, 85, 99, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="text-gray-100 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-gray-950 to-black antialiased selection:bg-orange-500/30">

    <!-- Offline Banner -->
    <div id="offline-banner" class="hidden fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-red-600/90 backdrop-blur border border-red-500 text-white px-6 py-3 rounded-full shadow-[0_0_15px_rgba(220,38,38,0.5)] font-mono font-bold text-sm items-center gap-3 slide-up transition-all uppercase tracking-widest">
        <i class="fa-solid fa-triangle-exclamation animate-pulse"></i>
        <span>Device Connection Lost</span>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- Login Screen -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 transition-opacity p-4">
        <div class="bg-gray-900/90 backdrop-blur-xl p-8 sm:p-10 rounded-2xl border border-gray-700 shadow-2xl max-w-sm w-full slide-up">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-orange-900/50 border border-orange-500/30 rounded-xl flex items-center justify-center mx-auto mb-6 rotate-3 shadow-[0_0_15px_rgba(234,88,12,0.2)]">
                    <i class="fa-solid fa-industry text-3xl text-orange-500"></i>
                </div>
                <h2 class="text-2xl font-bold font-mono tracking-wide text-white uppercase">SCADA Terminal</h2>
                <p class="text-xs text-gray-400 mt-2 font-mono uppercase tracking-widest">Auth Protocol</p>
            </div>
            
            <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
                <div class="space-y-4">
                    <div>
                        <div class="relative">
                            <i class="fa-solid fa-user-shield absolute left-4 top-3.5 text-gray-500"></i>
                            <input type="email" id="email" required class="w-full bg-gray-950/50 border border-gray-700 rounded-xl py-3 pl-11 pr-4 focus:bg-gray-900 focus:ring-1 focus:ring-orange-500 outline-none transition-all text-white font-mono text-sm placeholder-gray-600" placeholder="Operator Email">
                        </div>
                    </div>
                    <div>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-4 top-3.5 text-gray-500"></i>
                            <input type="password" id="password" required class="w-full bg-gray-950/50 border border-gray-700 rounded-xl py-3 pl-11 pr-4 focus:bg-gray-900 focus:ring-1 focus:ring-orange-500 outline-none transition-all text-white font-mono text-sm placeholder-gray-600" placeholder="Clearance Code">
                        </div>
                    </div>
                </div>
                <div id="login-error" class="hidden text-xs text-red-400 font-mono text-center bg-red-950/30 py-2.5 rounded border border-red-900/50 uppercase tracking-widest">ACCESS DENIED</div>
                <button type="submit" id="login-btn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold font-mono uppercase tracking-widest py-3.5 rounded-xl transition-all shadow-[0_0_15px_rgba(234,88,12,0.3)] active:scale-[0.98] mt-4">
                    Initiate Link
                </button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden min-h-screen pb-24 flex flex-col items-center">
        
        <!-- Header -->
        <header class="w-full max-w-5xl pt-8 pb-6 px-4 sm:px-6 sticky top-0 z-40 bg-[#030712]/90 backdrop-blur-xl border-b border-gray-800 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="bg-gradient-to-br from-orange-600 to-red-600 p-2.5 rounded-lg text-white shadow-[0_0_10px_rgba(234,88,12,0.5)]"><i class="fa-solid fa-industry text-xl"></i></div>
                <div>
                    <h1 class="text-xl font-bold font-mono tracking-widest uppercase">Factory SCADA</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <div id="connection-indicator" class="w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)]"></div>
                        <span id="connection-status" class="text-[10px] font-mono text-gray-400 tracking-widest uppercase">CONNECTING...</span>
                    </div>
                </div>
            </div>
            
            <!-- Global Environment Panel -->
            <div class="flex-1 w-full md:w-auto max-w-2xl bg-gray-900 border border-gray-800 rounded-xl p-2.5 flex flex-wrap sm:flex-nowrap items-center justify-between gap-4 shadow-inner">
                <div class="flex gap-6 px-3">
                    <div><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest">Ambient</p><p class="font-mono font-bold text-gray-200"><span id="env-temp" class="text-lg">--</span>°C</p></div>
                    <div><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest">Humidity</p><p class="font-mono font-bold text-gray-200"><span id="env-hum" class="text-lg">--</span>%</p></div>
                </div>
                <div class="flex items-center gap-2 sm:border-l border-gray-800 sm:pl-4 w-full sm:w-auto">
                    <button id="btn-fan" onclick="toggleEnv('cooling_fan')" class="flex-1 sm:flex-none font-mono text-[10px] font-bold px-3 py-2 rounded bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors border border-gray-700 uppercase tracking-widest">FAN OFF</button>
                    <button id="btn-alarm" onclick="toggleEnv('alarm')" class="flex-1 sm:flex-none font-mono text-[10px] font-bold px-3 py-2 rounded bg-gray-800 text-gray-400 hover:bg-red-900/50 transition-colors border border-gray-700 uppercase tracking-widest">ALARM OFF</button>
                    <button onclick="logout()" class="font-mono text-[10px] font-bold px-3 py-2 rounded bg-gray-950 text-gray-500 hover:text-red-500 hover:bg-gray-800 transition-colors border border-gray-800" title="Disconnect"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </div>
        </header>

        <main class="w-full max-w-5xl px-4 sm:px-6 py-8 slide-up space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <!-- Machine 1 -->
                <div class="glass-panel rounded-2xl overflow-hidden flex flex-col transition-colors border-gray-800" id="m1-card">
                    <div class="bg-gray-800/50 px-5 py-4 border-b border-gray-800 flex justify-between items-center">
                        <div class="flex items-center gap-3"><i class="fa-solid fa-microchip text-blue-500 text-xl"></i><h2 class="text-lg font-bold font-mono tracking-widest text-white">CNC MILLING 01</h2></div>
                        <span id="m1-status" class="px-2 py-1 rounded text-[10px] font-bold font-mono tracking-widest bg-gray-800 text-gray-500 border border-gray-700">OFFLINE</span>
                    </div>
                    <div class="p-6 flex-1 space-y-8 bg-gradient-to-b from-gray-900/50 to-transparent">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">State</p><p id="m1-state" class="font-mono font-bold text-gray-400 text-sm">--</p></div>
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">RPM</p><p class="font-mono font-bold text-blue-400 text-2xl"><span id="m1-rpm">0</span></p></div>
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Temp</p><p class="font-mono font-bold text-orange-500 text-2xl"><span id="m1-temp">--</span>°</p></div>
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Vibration</p><p class="font-mono font-bold text-yellow-500 text-2xl"><span id="m1-vib">--</span></p></div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="machineCmd('m1', 'start')" class="flex-1 bg-green-900/30 hover:bg-green-800 text-green-500 hover:text-white border border-green-700/50 py-4 rounded-xl font-mono font-bold tracking-widest transition-all text-sm active:scale-95 shadow-sm">START</button>
                            <button onclick="machineCmd('m1', 'stop')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 py-4 rounded-xl font-mono font-bold tracking-widest transition-all text-sm active:scale-95 shadow-sm">STOP</button>
                            <button onclick="machineCmd('m1', 'reset')" class="flex-1 bg-red-900/30 hover:bg-red-800 text-red-500 hover:text-white border border-red-800/50 py-4 rounded-xl font-mono font-bold tracking-widest transition-all text-sm active:scale-95 shadow-sm">RESET</button>
                        </div>
                    </div>
                </div>

                <!-- Machine 2 -->
                <div class="glass-panel rounded-2xl overflow-hidden flex flex-col transition-colors border-gray-800" id="m2-card">
                    <div class="bg-gray-800/50 px-5 py-4 border-b border-gray-800 flex justify-between items-center">
                        <div class="flex items-center gap-3"><i class="fa-solid fa-gear text-purple-500 text-xl"></i><h2 class="text-lg font-bold font-mono tracking-widest text-white">LATHE 02</h2></div>
                        <span id="m2-status" class="px-2 py-1 rounded text-[10px] font-bold font-mono tracking-widest bg-gray-800 text-gray-500 border border-gray-700">OFFLINE</span>
                    </div>
                    <div class="p-6 flex-1 space-y-8 bg-gradient-to-b from-gray-900/50 to-transparent">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">State</p><p id="m2-state" class="font-mono font-bold text-gray-400 text-sm">--</p></div>
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">RPM</p><p class="font-mono font-bold text-purple-400 text-2xl"><span id="m2-rpm">0</span></p></div>
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Temp</p><p class="font-mono font-bold text-orange-500 text-2xl"><span id="m2-temp">--</span>°</p></div>
                            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 flex flex-col items-center justify-center text-center shadow-inner"><p class="text-[10px] text-gray-500 font-mono uppercase tracking-widest mb-1">Vibration</p><p class="font-mono font-bold text-yellow-500 text-2xl"><span id="m2-vib">--</span></p></div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="machineCmd('m2', 'start')" class="flex-1 bg-green-900/30 hover:bg-green-800 text-green-500 hover:text-white border border-green-700/50 py-4 rounded-xl font-mono font-bold tracking-widest transition-all text-sm active:scale-95 shadow-sm">START</button>
                            <button onclick="machineCmd('m2', 'stop')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 py-4 rounded-xl font-mono font-bold tracking-widest transition-all text-sm active:scale-95 shadow-sm">STOP</button>
                            <button onclick="machineCmd('m2', 'reset')" class="flex-1 bg-red-900/30 hover:bg-red-800 text-red-500 hover:text-white border border-red-800/50 py-4 rounded-xl font-mono font-bold tracking-widest transition-all text-sm active:scale-95 shadow-sm">RESET</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="glass-panel p-5 rounded-2xl border-gray-800">
                <h3 class="font-bold mb-3 font-mono text-gray-500 text-[10px] tracking-widest uppercase">SYSTEM TERMINAL LOG</h3>
                <div id="event-log" class="h-28 overflow-y-auto font-mono text-[10px] sm:text-xs space-y-1.5 text-green-400 bg-gray-950 p-4 rounded-xl border border-gray-800 shadow-inner"></div>
            </div>
        </main>
    </div>

    <script>
        const PLATFORM_BASE_URL = window.PLATFORM_BASE_URL || 'http://localhost:3000';
        const PLATFORM_APP_ID = window.PLATFORM_APP_ID || 'REPLACE_WITH_APP_ID';

        const ROUTES = {
            env_telemetry: '/api/v1/routes/factory_env_tel_route_id',
            env_commands: '/api/v1/routes/factory_env_cmd_route_id',
            m1_telemetry: '/api/v1/routes/factory_m1_tel_route_id',
            m1_commands: '/api/v1/routes/factory_m1_cmd_route_id',
            m2_telemetry: '/api/v1/routes/factory_m2_tel_route_id',
            m2_commands: '/api/v1/routes/factory_m2_cmd_route_id'
        };

        let authToken = localStorage.getItem('factoryAuthToken');
        let appStateCache = JSON.parse(localStorage.getItem('factoryStateCache') || '{"env":{}, "m1":{}, "m2":{}}');
        let streams = [];
        let knownDevices = new Set();
        let offlineDevices = new Set();

        window.onload = () => { if (authToken) showDashboard(); };

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const isError = type === 'error';
            toast.className = `slide-up px-5 py-3 rounded-xl shadow-xl font-mono text-xs font-bold tracking-wide flex items-center gap-3 ${
                isError ? 'bg-red-950/90 text-red-400 border border-red-900/50 backdrop-blur' : 'bg-gray-800 text-white border border-gray-700'
            }`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-xmark' : 'fa-circle-check'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function updateCache(prefix, data) {
            if(!appStateCache[prefix]) appStateCache[prefix] = {};
            appStateCache[prefix] = { ...appStateCache[prefix], ...data };
            localStorage.setItem('factoryStateCache', JSON.stringify(appStateCache));
        }

        function addLog(msg) {
            const log = document.getElementById('event-log');
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] > ${msg}`;
            log.appendChild(div); log.scrollTop = log.scrollHeight;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            btn.textContent = 'AUTHENTICATING...'; btn.disabled = true; err.classList.add('hidden');

            try {
                const res = await fetch(`${PLATFORM_BASE_URL}/api/applications/${PLATFORM_APP_ID}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    authToken = data.token; localStorage.setItem('factoryAuthToken', authToken); showDashboard();
                } else throw new Error(data.message || 'ACCESS DENIED');
            } catch (error) {
                err.innerText = error.message; err.classList.remove('hidden');
            } finally {
                btn.textContent = 'INITIATE LINK'; btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('factoryAuthToken'); 
            localStorage.removeItem('factoryStateCache'); 
            authToken = null; appStateCache = { env:{}, m1:{}, m2:{} };
            streams.forEach(s => s.abort()); streams = [];
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function showDashboard() {
            if (PLATFORM_APP_ID.includes('REPLACE_WITH')) {
                alert("Please replace PLATFORM_APP_ID and ROUTES with actual Application API values."); logout(); return;
            }
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            // Instantly apply cached persistent state
            processEnv(appStateCache.env);
            processMachine('m1', appStateCache.m1);
            processMachine('m2', appStateCache.m2);
            
            connectSSE(ROUTES.env_telemetry, processEnv, 'env');
            connectSSE(ROUTES.m1_telemetry, (data) => processMachine('m1', data), 'm1');
            connectSSE(ROUTES.m2_telemetry, (data) => processMachine('m2', data), 'm2');
        }

        async function connectSSE(route, callback, prefix) {
            const controller = new AbortController();
            streams.push(controller);
            const indicator = document.getElementById('connection-indicator');
            const statusTxt = document.getElementById('connection-status');
            
            indicator.className = 'w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)]';
            statusTxt.innerText = 'LINKING...';

            try {
                const res = await fetch(`${PLATFORM_BASE_URL}${route}`, {
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Accept': 'text/event-stream' },
                    signal: controller.signal
                });
                if (!res.ok) throw new Error("SSE connection failed");

                indicator.className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]';
                statusTxt.innerText = 'ONLINE';

                if(prefix !== 'env') {
                    const st = document.getElementById(`${prefix}-status`);
                    st.innerText = 'ONLINE';
                    st.className = 'px-2 py-1 rounded text-[10px] font-bold font-mono tracking-widest bg-green-900/50 text-green-400 border border-green-800 shadow-sm';
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const chunks = buffer.split('\n\n');
                    buffer = chunks.pop();

                    for (const chunk of chunks) {
                        let eventType = 'message', dataStr = null;
                        for (const line of chunk.split('\n')) {
                            if (line.startsWith('event: ')) eventType = line.slice(7).trim();
                            else if (line.startsWith('data: ')) dataStr = line.slice(6).trim();
                        }
                        if (dataStr) {
                            if (eventType === 'device_data') {
                                try { callback(JSON.parse(dataStr).payload); } catch(e){}
                            } else if (eventType === 'device_status') {
                                try { processStatus(JSON.parse(dataStr)); } catch(e){}
                            }
                        }
                    }
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    addLog(`[${prefix}] Link dropped, reconnecting...`);
                    indicator.className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]';
                    statusTxt.innerText = 'OFFLINE';
                    
                    if(prefix !== 'env') {
                        const st = document.getElementById(`${prefix}-status`);
                        st.innerText = 'OFFLINE';
                        st.className = 'px-2 py-1 rounded text-[10px] font-bold font-mono tracking-widest bg-gray-800 text-gray-500 border border-gray-700';
                    }
                    setTimeout(() => connectSSE(route, callback, prefix), 3000);
                }
            }
        }

        function processStatus(data) {
            if (!data || !data.deviceId) return;
            const banner = document.getElementById('offline-banner');
            const statusTxt = document.getElementById('connection-status');
            
            knownDevices.add(data.deviceId);
            const status = data.status.toLowerCase();

            if (status === 'offline') offlineDevices.add(data.deviceId);
            else if (status === 'online') offlineDevices.delete(data.deviceId);
            
            const onlineCount = knownDevices.size - offlineDevices.size;
            statusTxt.innerText = `ONLINE (${onlineCount} DEVICE${onlineCount !== 1 ? 'S' : ''})`;
            
            if (offlineDevices.size > 0) { banner.classList.remove('hidden'); banner.classList.add('flex'); }
            else { banner.classList.add('hidden'); banner.classList.remove('flex'); }
        }

        function processEnv(data) {
            if(!data) return;
            updateCache('env', data);
            
            if(data.temperature !== undefined) document.getElementById('env-temp').innerText = data.temperature;
            if(data.humidity !== undefined) document.getElementById('env-hum').innerText = data.humidity;
            
            if(data.cooling_fan !== undefined) {
                const bFan = document.getElementById('btn-fan');
                bFan.innerText = data.cooling_fan ? 'FAN ON' : 'FAN OFF';
                bFan.className = data.cooling_fan ? 'flex-1 sm:flex-none font-mono text-[10px] font-bold px-3 py-2 rounded bg-blue-600 text-white border border-blue-400 shadow-[0_0_10px_rgba(37,99,235,0.6)] uppercase tracking-widest' : 'flex-1 sm:flex-none font-mono text-[10px] font-bold px-3 py-2 rounded bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors border border-gray-700 uppercase tracking-widest';
            }
            if(data.alarm !== undefined) {
                const bAlm = document.getElementById('btn-alarm');
                bAlm.innerText = data.alarm ? 'ALARM ACTIVE' : 'ALARM OFF';
                bAlm.className = data.alarm ? 'flex-1 sm:flex-none font-mono text-[10px] font-bold px-3 py-2 rounded bg-red-600 text-white border border-red-400 shadow-[0_0_15px_rgba(220,38,38,0.8)] animate-pulse uppercase tracking-widest' : 'flex-1 sm:flex-none font-mono text-[10px] font-bold px-3 py-2 rounded bg-gray-800 text-gray-400 hover:bg-red-900/50 transition-colors border border-gray-700 uppercase tracking-widest';
            }
        }

        function processMachine(prefix, data) {
            if(!data) return;
            updateCache(prefix, data);
            
            const stateEl = document.getElementById(`${prefix}-state`);
            const cardEl = document.getElementById(`${prefix}-card`);
            
            if(data.operating_state) {
                stateEl.innerText = data.operating_state;
                if(data.operating_state === 'RUNNING') {
                    stateEl.className = 'font-mono font-bold text-green-400 text-sm';
                    cardEl.className = 'glass-panel rounded-2xl overflow-hidden flex flex-col transition-colors border-green-900/50 shadow-[0_0_30px_rgba(34,197,94,0.1)]';
                }
                else if(data.operating_state === 'WARNING') {
                    stateEl.className = 'font-mono font-bold text-red-500 text-sm animate-pulse drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]';
                    cardEl.className = 'glass-panel rounded-2xl overflow-hidden flex flex-col transition-colors border-red-900/80 shadow-[0_0_30px_rgba(220,38,38,0.15)]';
                }
                else {
                    stateEl.className = 'font-mono font-bold text-gray-400 text-sm';
                    cardEl.className = 'glass-panel rounded-2xl overflow-hidden flex flex-col transition-colors border-gray-800';
                }
            }
            if(data.rpm !== undefined) document.getElementById(`${prefix}-rpm`).innerText = data.rpm;
            if(data.temperature !== undefined) document.getElementById(`${prefix}-temp`).innerText = data.temperature;
            if(data.vibration !== undefined) document.getElementById(`${prefix}-vib`).innerText = data.vibration;
        }

        async function machineCmd(machine, cmd) {
            let route = machine === 'm1' ? ROUTES.m1_commands : ROUTES.m2_commands;
            addLog(`SYS CMD: ${machine} -> ${cmd}`);
            try {
                const response = await fetch(`${PLATFORM_BASE_URL}${route}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: cmd })
                });
                const resData = await response.json();
                if (!response.ok || !resData.success) throw new Error(resData.message || 'Command failed');
            } catch(e) { 
                addLog("ERR: " + e.message); 
                showToast(e.message, 'error');
            }
        }

        async function toggleEnv(prop) {
            const previousVal = appStateCache.env[prop];
            let newVal = !appStateCache.env[prop];
            
            addLog(`SYS CMD: env -> ${prop}=${newVal}`);
            
            // Optimistic UI Update
            processEnv({ [prop]: newVal });
            
            try {
                const response = await fetch(`${PLATFORM_BASE_URL}${ROUTES.env_commands}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: `SET_${prop.toUpperCase()}`,
                        payload: { [prop]: newVal }
                    })
                });
                const resData = await response.json();
                if (!response.ok || !resData.success) throw new Error(resData.message || 'Command failed');
            } catch(e) { 
                addLog("ERR: " + e.message); 
                showToast(e.message, 'error');
                
                // Revert optimistic update
                if(previousVal !== undefined) processEnv({ [prop]: previousVal });
            }
        }
    </script>
</body>
</html>
