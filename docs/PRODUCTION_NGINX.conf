# 1. MAIN PLATFORM REDIRECT (www -> canonical)
server {
    listen 80;
    server_name www.mydevice.in;
    return 301 https://mydevice.in$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mydevice.in-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mydevice.in-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 2. MAIN PLATFORM SERVER
server {
    listen 80;
    server_name mydevice.in;
    root /var/www/html;
    index index.html;
    
    # Platform APIs
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    
    # Core Hosted Apps route for main domain accesses
    location /hosted/ {
        proxy_pass http://localhost:3000/hosted/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    
    # React Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mydevice.in-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mydevice.in-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 3. WILDCARD SUBDOMAINS -> Hosted Uploaded Applications
# Reserved infrastructure names are explicitly excluded.
server {
    listen 80;
    
    # Dynamically captures the subdomain as $app_slug (excluding www, api, mqtt)
    server_name ~^(?<app_slug>(?!www$|api$|mqtt$)[a-zA-Z0-9-]+)\.mydevice\.in$;
    
    # Route API traffic directly to the backend API router
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route all other traffic to the Node.js backend using the captured slug (static app files)
    location / {
        # E.g., application1.mydevice.in/assets/app.js -> http://localhost:3000/hosted/application1/assets/app.js
        proxy_pass http://localhost:3000/hosted/$app_slug$request_uri;
        
        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mydevice.in-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mydevice.in-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
