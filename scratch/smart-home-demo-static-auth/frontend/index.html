<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Control</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Platform Injection Will Happen Here -->
</head>
<body>
    <!-- Background Elements for Aesthetics -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div id="app">
        <!-- Dashboard View -->
        <div id="dashboard-view" class="view active">
            <div class="dashboard-header glass-panel">
                <div class="title">
                    <h2>Living Room Controller</h2>
                    <span id="connection-status" class="status-badge connecting">Connecting...</span>
                </div>
            </div>

            <div class="dashboard-grid">
                <!-- Environment Sensors -->
                <div class="glass-panel sensor-card">
                    <div class="sensor-icon">🌡️</div>
                    <div class="sensor-info">
                        <h3>Temperature</h3>
                        <div class="sensor-value" id="temp-val">-- °C</div>
                    </div>
                </div>

                <div class="glass-panel sensor-card">
                    <div class="sensor-icon">💧</div>
                    <div class="sensor-info">
                        <h3>Humidity</h3>
                        <div class="sensor-value" id="hum-val">-- %</div>
                    </div>
                </div>

                <!-- Actuators -->
                <div class="glass-panel control-card">
                    <div class="control-header">
                        <div class="control-icon" id="light-icon">💡</div>
                        <h3>Main Light</h3>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="lightToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="glass-panel control-card">
                    <div class="control-header">
                        <div class="control-icon" id="fan-icon" style="transition: transform 0.2s;">🌀</div>
                        <h3>Ceiling Fan</h3>
                    </div>
                    <div class="fan-controls">
                        <input type="range" id="fanSlider" min="0" max="3" value="0" step="1">
                        <div class="fan-labels">
                            <span>Off</span>
                            <span>Low</span>
                            <span>Med</span>
                            <span>High</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Terminal / Event Log -->
            <div class="glass-panel terminal-card">
                <div class="terminal-header">
                    <div class="dots">
                        <span></span><span></span><span></span>
                    </div>
                    <h3>System Logs</h3>
                </div>
                <div class="terminal-body" id="event-log">
                    <div class="log-entry system">System initialized. Awaiting connection...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
